# ──────────────────────────────────────────────────────────────────────
#  NextGenPay — Auto-deploy to EC2 on push to main
# ──────────────────────────────────────────────────────────────────────
#  Triggers:
#    • Every push to the `main` branch
#    • Manual dispatch from the Actions tab ("Run workflow")
#
#  Required GitHub Secrets (Settings → Secrets and variables → Actions):
#    EC2_SSH_KEY  — contents of the .pem private key file
#    EC2_HOST     — public IP or hostname (e.g. 65.0.202.152)
#    EC2_USER     — SSH user (e.g. ubuntu)
# ──────────────────────────────────────────────────────────────────────

name: 🚀 Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false          # let running deploys finish

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🔑 SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            echo "── GitHub Actions deploy triggered ──"
            echo "Commit: ${{ github.sha }}"
            echo "By:     ${{ github.actor }}"
            echo ""
            bash ~/deploy.sh
